syntax = "proto3";
package newnoa.rpc;
import "google/protobuf/any.proto";

// Fixed TypeUrl values and bounded payload schemas are defined in frames.go.
// Requests: request-head, data*, request-end. Responses: response-head, data*, response-end.
service ModelTransport {
  rpc Exchange(stream google.protobuf.Any) returns (stream google.protobuf.Any);
}
